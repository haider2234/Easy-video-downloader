name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  # Allows you to manually trigger the sync from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git credentials using your secret token
          git remote add hf https://haider-abbas:$HF_TOKEN@huggingface.co/spaces/haider-abbas/easy-downloader
          
          # Force push the main branch to Hugging Face's repository
          git push --force hf main
