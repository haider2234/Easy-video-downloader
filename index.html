<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDownloader - High Speed Video Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 🟢 PLACEMENT 1: POP-UNDER AD CONTEXT INJECTION (Triggers on first background tap) -->
    <script type='text/javascript' src='//your-ad-network-script-url.com/popunder.js'></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-12 px-4 selection:bg-blue-500/30">

    <div class="w-full max-w-2xl flex flex-col gap-6">
        
        <!-- 🟢 PLACEMENT 2: HIGH-CONVERSION RESPONSIVE TOP BANNER AD -->
        <div class="w-full bg-slate-900/40 border border-white/5 rounded-2xl p-2 flex items-center justify-center min-h-[90px] text-xs text-slate-600 tracking-wider uppercase">
            <!-- Paste your AdSense / Adsterra / PropellerAds Banner Code Script Tag Here -->
            🏷️ Advertisement Banner Slot
        </div>

        <!-- Main Downloader App Card Interface -->
        <div class="w-full bg-slate-900/60 border border-white/5 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl shadow-blue-950/20">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">EasyDownloader</h1>
            <p class="text-slate-400 text-xs md:text-sm mt-2 font-medium">Bypass limits. Stream and save your favorite media assets instantly.</p>
            
            <div class="mt-8 flex flex-col md:flex-row gap-3">
                <input type="text" id="videoUrl" placeholder="Paste your video link path right here..." class="flex-1 bg-slate-950/80 border border-white/5 hover:border-white/10 focus:border-blue-500/50 rounded-xl px-4 py-3.5 text-sm outline-none transition placeholder:text-slate-600 text-slate-200 font-medium">
                <button onclick="fetchOptions()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm px-6 py-3.5 rounded-xl transition shadow-lg shadow-blue-600/10 active:scale-[0.98]">Extract Links</button>
            </div>

            <!-- Loading Spinner State Component -->
            <div id="status" class="hidden mt-8 text-center text-xs text-slate-500 font-medium tracking-wide animate-pulse">
                Parsing streaming nodes... Please stand by... ⚡
            </div>

            <!-- Resolution Results Display Panel Wrapper -->
            <div id="result" class="hidden mt-8 pt-6 border-t border-white/5 flex flex-col gap-5">
                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                    <img id="thumb" class="w-full sm:w-36 aspect-video rounded-xl object-cover border border-white/5 bg-slate-950" src="" alt="Thumbnail Preview">
                    <h2 id="videoTitle" class="text-sm md:text-base font-bold text-slate-200 line-clamp-2">Processing video media asset...</h2>
                </div>
                
                <!-- 🟢 PLACEMENT 3: IN-LINE CONTENT RESULTS AD BANNER (High engagement click-through rate) -->
                <div class="w-full bg-slate-950/40 border border-white/5 rounded-xl p-2 flex items-center justify-center min-h-[60px] text-[10px] text-slate-700 tracking-widest uppercase">
                    <!-- Paste your Native Inline Ad Code Script Tag Here -->
                    Sponsored Link Asset
                </div>

                <div id="linksContainer" class="grid grid-cols-1 gap-2.5 w-full">
                    <!-- Format option buttons are programmatically injected here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Front-End Routing Communication Engine Script -->
    <script>
        async function fetchOptions() {
            const url = document.getElementById('videoUrl').value.trim();
            if(!url) return alert("Please supply a valid target link URL!");

            const status = document.getElementById('status');
            const result = document.getElementById('result');
            const linksContainer = document.getElementById('linksContainer');
            
            status.classList.remove('hidden');
            result.classList.add('hidden');
            linksContainer.innerHTML = '';

            // 💡 1. RENAME THIS BASE STRING TO YOUR LIVE RENDER BACKEND APP URL
            const RENDER_BACKEND_URL = "https://easy-downloader-api.onrender.com"; 

            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || "Server processing boundary block.");
                
                document.getElementById('thumb').src = data.thumbnail || '';
                document.getElementById('videoTitle').innerText = data.title || 'Video File Asset';
                
                data.formats.forEach(format => {
                    const el = document.createElement('a');
                    
                    // Route the direct streaming links through our active Render proxy pipeline method
                    el.href = `${RENDER_BACKEND_URL}/api/download?url=${encodeURIComponent(format.direct_url)}&title=${encodeURIComponent(data.title)}&ext=${format.ext}`;
                    el.target = "_blank";
                    
                    el.className = "group flex justify-between items-center bg-slate-950/60 hover:bg-slate-900 border border-white/5 hover:border-white/10 px-4 py-3.5 rounded-xl text-xs transition font-medium w-full text-slate-300 no-underline";
                    
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400 border border-blue-500/10">💾</div>
                            <div class="flex flex-col text-left">
                                <span class="text-slate-200 font-semibold">${format.resolution} Quality Stream</span>
                                <span class="text-slate-500 text-[10px] mt-0.5">Container: ${format.ext.toUpperCase()}</span>
                            </div>
                        </div>
                        <span class="text-blue-400 font-bold bg-blue-500/10 px-2.5 py-1.5 rounded-lg border border-blue-500/20 group-hover:bg-blue-600 group-hover:text-white transition uppercase text-[10px] tracking-wide">Download →</span>
                    `;
                    linksContainer.appendChild(el);
                });

                result.classList.remove('hidden');
            } catch (err) {
                alert(err.message);
            } finally {
                status.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
